services:
  db:
    image: postgres:15-alpine
    container_name: pm-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-project_db}
      POSTGRES_USER: ${DB_USER:-pm_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePass@Tuong2026!DTC245200211}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_net # Hardening: Co lap hoan toan khoi Internet, khong expose port ra host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pm_admin} -d ${DB_NAME:-project_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: pm-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - backend_net
      - frontend_net
    depends_on:
      - db

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pm-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@tuong.ictu.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-SecurePass@Tuong2026!}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - backend_net
      - frontend_net
    depends_on:
      - db

  webapp:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: pm-webapp
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-project_db}
      DB_USER: ${DB_USER:-pm_admin}
      DB_PASSWORD: ${DB_PASSWORD:-SecurePass@Tuong2026!DTC245200211}
      LOG_LEVEL: info
    volumes:
      - webapp_logs:/var/log/webapp
    networks:
      - frontend_net
      - backend_net
      - monitoring_net
    depends_on:
      db:
        condition: service_healthy
  nginx:
    image: nginx:1.25-alpine
    container_name: pm-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend_net
      - monitoring_net
    depends_on:
      - webapp

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: pm-prometheus
    restart: unless-stopped
    user: "root"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks:
      - monitoring_net
      - frontend_net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:10.4.0
    container_name: pm-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-AdminSecure@2026!}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_net
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:2.9.4
    container_name: pm-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring_net
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.4
    container_name: pm-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - nginx_logs:/var/log/nginx:ro
      - webapp_logs:/var/log/webapp:ro
    networks:
      - monitoring_net
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: pm-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    networks:
      - monitoring_net

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: pm-node-exporter
    restart: unless-stopped
    networks:
      - monitoring_net

networks:
  frontend_net:
    driver: bridge
    name: pm_frontend_net
  backend_net:
    driver: bridge
    internal: true # Hardening: Mang noi bo khong co route ra ngoai Internet
    name: pm_backend_net
  monitoring_net:
    driver: bridge
    name: pm_monitoring_net

volumes:
  pgdata:
    name: pm_pgdata
  nginx_logs:
    name: pm_nginx_logs
  webapp_logs:
    name: pm_webapp_logs
  prom_data:
    name: pm_prometheus_data
  grafana_data:
    name: pm_grafana_data
  loki_data:
    name: pm_loki_data
