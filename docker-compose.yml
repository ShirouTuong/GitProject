# ==============================================================================
# BÀI TẬP LỚN / BÀI KIỂM TRA CUỐI KỲ: TRIỂN KHAI VÀ QUẢN TRỊ HỆ THỐNG PHẦN MỀM
# Đề tài 14: Hệ thống Quản lý Dự án (Project Management)
# Sinh viên thực hiện: Trịnh Ngọc Tường
# Mã số sinh viên (MSSV): DTC245200211 - STT: 54
# Trường: Đại học Công nghệ Thông tin và Truyền thông Thái Nguyên (ICTU)
# ==============================================================================

services:
  # ============================================================================
  # DỊCH VỤ 1: CƠ SỞ DỮ LIỆU POSTGRESQL (BƯỚC 1 - HARDENING NETWORK ISOLATION)
  # ============================================================================
  db:
    image: postgres:15-alpine
    container_name: pm-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-project_db}
      POSTGRES_USER: ${DB_USER:-pm_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePass@Tuong2026!DTC245200211}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_net # Hardening: Co lap hoan toan khoi Internet, khong expose port ra host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pm_admin} -d ${DB_NAME:-project_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # DỊCH VỤ 2: CÔNG CỤ QUẢN TRỊ CSDL TRỰC QUAN ADMINER (BƯỚC 1)
  # ============================================================================
  adminer:
    image: adminer:latest
    container_name: pm-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - backend_net
      - frontend_net
    depends_on:
      - db

  # ============================================================================
  # DỊCH VỤ 3: ỨNG DỤNG WEB QUẢN LÝ DỰ ÁN (BƯỚC 2 - HARDENING NON-ROOT USER)
  # ============================================================================
  webapp:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: pm-webapp
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-project_db}
      DB_USER: ${DB_USER:-pm_admin}
      DB_PASSWORD: ${DB_PASSWORD:-SecurePass@Tuong2026!DTC245200211}
      LOG_LEVEL: info
    volumes:
      - webapp_logs:/var/log/webapp
    networks:
      - frontend_net
      - backend_net
      - monitoring_net
    depends_on:
      db:
        condition: service_healthy

  # ============================================================================
  # DỊCH VỤ 4: NGINX REVERSE PROXY & SSL HARDENING (BƯỚC 3 - COMMIT 1)
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: pm-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend_net
      - monitoring_net
    depends_on:
      - webapp

  # ============================================================================
  # DỊCH VỤ 5: HỆ THỐNG THU THẬP METRICS PROMETHEUS (BƯỚC 4 - COMMIT 2)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: pm-prometheus
    restart: unless-stopped
    user: "root"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    networks:
      - monitoring_net
      - frontend_net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'

  # ============================================================================
  # DỊCH VỤ 6: BẢNG ĐIỀU KHIỂN TRỰC QUAN GRAFANA (BƯỚC 4 - COMMIT 2)
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: pm-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-AdminSecure@2026!}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring_net
    depends_on:
      - prometheus
      - loki

  # ============================================================================
  # DỊCH VỤ 7: HỆ THỐNG LƯU TRỮ LOG TẬP TRUNG LOKI (BƯỚC 5 - COMMIT 3)
  # ============================================================================
  loki:
    image: grafana/loki:2.9.4
    container_name: pm-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring_net
    command: -config.file=/etc/loki/local-config.yaml

  # ============================================================================
  # DỊCH VỤ 8: PROMTAIL AGENT THU THẬP LOG CONTAINER (BƯỚC 5 - COMMIT 3)
  # ============================================================================
  promtail:
    image: grafana/promtail:2.9.4
    container_name: pm-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - nginx_logs:/var/log/nginx:ro
      - webapp_logs:/var/log/webapp:ro
    networks:
      - monitoring_net
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # ============================================================================
  # DỊCH VỤ 9: CADVISOR - GIÁM SÁT RESOURCE CỦA CONTAINER (METRICS)
  # ============================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: pm-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    networks:
      - monitoring_net

# ==============================================================================
# CẤU HÌNH PHÂN TÁCH MẠNG NỘI BỘ (HARDENING: NETWORK ISOLATION - BƯỚC 6)
# ==============================================================================
networks:
  frontend_net:
    driver: bridge
    name: pm_frontend_net
  backend_net:
    driver: bridge
    internal: true # Hardening: Mang noi bo khong co route ra ngoai Internet
    name: pm_backend_net
  monitoring_net:
    driver: bridge
    name: pm_monitoring_net

# ==============================================================================
# LƯU TRỮ DỮ LIỆU BỀN VỮNG (PERSISTENT VOLUMES)
# ==============================================================================
volumes:
  pgdata:
    name: pm_pgdata
  nginx_logs:
    name: pm_nginx_logs
  webapp_logs:
    name: pm_webapp_logs
  prom_data:
    name: pm_prometheus_data
  grafana_data:
    name: pm_grafana_data
  loki_data:
    name: pm_loki_data
