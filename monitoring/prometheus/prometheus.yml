global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s

scrape_configs:
  # 1. Prometheus tu giam sat chinh minh
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Scrape metrics tu Ung dung Web Quan ly Du an (Node.js Express)
  - job_name: 'webapp'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['webapp:3000']
    relabel_configs:
      - target_label: application
        replacement: project-management

  # 3. Scrape metrics container tu cAdvisor (CPU, Memory, Network I/O)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 4. Scrape metrics he thong may chu tu Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
