apiVersion: 1

groups:
  - orgId: 1
    name: Security & Incident Alerts
    folder: DevOps & Observability
    interval: 10s
    rules:
      - uid: alert_http_5xx_incident
        title: High HTTP 5xx Error Rate Incident (An Toàn Thông Tin)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              editorMode: code
              expr: sum(rate(pm_http_requests_total{status_code=~"5.."}[1m])) or vector(0)
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: $B > 0.1
              refId: C
              type: math
        noDataState: OK
        execErrState: Error
        for: 10s
        annotations:
          summary: "Cảnh báo Tỷ lệ Lỗi HTTP 5xx vượt ngưỡng an toàn (> 5%)"
          description: "Hệ thống phát hiện dấu hiệu bất thường: Tỷ lệ mã phản hồi 5xx tăng đột biến trên cổng Nginx / Webapp, nghi vấn tấn công từ chối dịch vụ hoặc cạn kiệt tài nguyên CSDL."
        labels:
          severity: critical
          team: devops-soc
          incident: security-attack-simulation

      - uid: alert_webapp_container_down
        title: Web Application Container Status (Health Check)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              editorMode: code
              expr: up{job="webapp"}
              intervalMs: 1000
              maxDataPoints: 43200
              range: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: $B < 1
              refId: C
              type: math
        noDataState: Alerting
        execErrState: Error
        for: 10s
        annotations:
          summary: "Giám sát trạng thái khả dụng của Container Web Application"
          description: "Container pm-webapp không phản hồi HTTP probe từ Prometheus."
        labels:
          severity: warning
          team: devops-soc
